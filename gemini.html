<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .messages-container::-webkit-scrollbar {
            width: 6px;
        }
        .messages-container::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }
        pre {
            background-color: #f1f5f9;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            margin: 10px 0;
        }
        code {
            font-family: monospace;
        }
        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b p-4 flex justify-between items-center shadow-sm">
        <h1 class="text-xl font-bold text-sky-600 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-bot"><rect width="18" height="10" x="3" y="11" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><path d="M8 16h.01"/><path d="M16 16h.01"/></svg>
            Gemini AI Chat
        </h1>
        <div class="flex items-center gap-2">
            <input type="password" id="api-key" placeholder="Введите API Key" class="border rounded-lg px-3 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 w-40 md:w-64">
        </div>
    </header>

    <!-- Chat Messages -->
    <main id="chat-window" class="flex-1 overflow-y-auto p-4 md:p-8 messages-container">
        <div id="messages" class="max-w-3xl mx-auto space-y-6">
            <!-- Начальное сообщение -->
            <div class="flex gap-3">
                <div class="w-8 h-8 rounded-full bg-sky-100 flex items-center justify-center text-sky-600 flex-shrink-0">
                    AI
                </div>
                <div class="bg-white border rounded-2xl rounded-tl-none p-4 shadow-sm text-slate-700">
                    Привет! Введите ваш API ключ сверху и задайте мне любой вопрос.
                </div>
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <footer class="bg-white border-t p-4">
        <div class="max-w-3xl mx-auto flex gap-2">
            <textarea id="user-input" rows="1" placeholder="Спросите о чем угодно..." class="flex-1 border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-sky-500 resize-none overflow-hidden"></textarea>
            <button id="send-btn" class="bg-sky-600 text-white rounded-xl px-6 py-3 font-semibold hover:bg-sky-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-send-horizontal"><path d="m3 3 3 9-3 9 19-9Z"/><path d="M6 12h16"/></svg>
            </button>
        </div>
        <p class="text-center text-[10px] text-slate-400 mt-2">Используется модель gemini-2.5-flash-preview-09-2025</p>
    </footer>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const messagesDiv = document.getElementById('messages');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const apiKeyInput = document.getElementById('api-key');

        // Автоматическое изменение высоты текстового поля
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // Функция для добавления сообщения в интерфейс
        function appendMessage(role, text) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex gap-3 ${role === 'user' ? 'flex-row-reverse' : ''}`;
            
            const avatar = document.createElement('div');
            avatar.className = `w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 ${role === 'user' ? 'bg-slate-200 text-slate-600' : 'bg-sky-100 text-sky-600'}`;
            avatar.innerText = role === 'user' ? 'Вы' : 'AI';

            const content = document.createElement('div');
            content.className = `max-w-[85%] p-4 shadow-sm ${
                role === 'user' 
                ? 'bg-sky-600 text-white rounded-2xl rounded-tr-none' 
                : 'bg-white border rounded-2xl rounded-tl-none text-slate-700'
            }`;
            
            if (role === 'ai') {
                content.innerHTML = marked.parse(text);
            } else {
                content.innerText = text;
            }

            wrapper.appendChild(avatar);
            wrapper.appendChild(content);
            messagesDiv.appendChild(wrapper);
            chatWindow.scrollTo(0, chatWindow.scrollHeight);
            return content;
        }

        // Функция вызова API с экспоненциальной задержкой
        async function fetchGemini(prompt, retryCount = 0) {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) throw new Error("Пожалуйста, введите API ключ.");

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: "Ты — полезный и вежливый ассистент. Отвечай на языке пользователя." }] }
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    if (response.status === 429 && retryCount < 5) { // Too Many Requests
                        const delay = Math.pow(2, retryCount) * 1000;
                        await new Promise(resolve => setTimeout(resolve, delay));
                        return fetchGemini(prompt, retryCount + 1);
                    }
                    throw new Error(errorData.error?.message || "Ошибка API");
                }

                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "Извините, я не получил текст ответа.";
            } catch (error) {
                if (retryCount < 5) {
                    const delay = Math.pow(2, retryCount) * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return fetchGemini(prompt, retryCount + 1);
                }
                throw error;
            }
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                alert("Сначала введите API ключ Gemini!");
                return;
            }

            // Блокировка ввода
            userInput.value = '';
            userInput.style.height = 'auto';
            sendBtn.disabled = true;

            appendMessage('user', text);

            // Сообщение-заглушка ожидания
            const aiMsgDiv = appendMessage('ai', '<span class="loading-dots">Думаю</span>');

            try {
                const aiResponse = await fetchGemini(text);
                aiMsgDiv.innerHTML = marked.parse(aiResponse);
            } catch (error) {
                aiMsgDiv.innerHTML = `<span class="text-red-500 italic">Ошибка: ${error.message}</span>`;
            } finally {
                sendBtn.disabled = false;
                chatWindow.scrollTo(0, chatWindow.scrollHeight);
            }
        }

        sendBtn.onclick = handleSend;
        userInput.onkeydown = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        };
    </script>
</body>
</html>
