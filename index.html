<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Бесплатные Robux</title>
    <style>
        body { margin:0; background:#1b1b2f; font-family: 'Segoe UI', Arial, sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; }
        .container { background:#282846; padding:40px; border-radius:16px; text-align:center; max-width:400px; }
        h1 { color:#ffd700; font-size:28px; }
        .timer { color:#ff6b6b; font-weight:bold; font-size:22px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity:0.3; } }
        .btn { background:#e03a3a; border:none; color:white; font-size:20px; padding:15px 40px; border-radius:30px; cursor:pointer; margin-top:20px; transition:0.2s; }
        .btn:hover { background:#c02a2a; transform:scale(1.02); }
        .footnote { color:#888; font-size:12px; margin-top:30px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎁 Получи бесплатные Robux!</h1>
        <p style="color:#ccc;">Только сегодня – 10 000 Robux за просмотр рекламы.</p>
        <div class="timer">⏳ ОСТАЛОСЬ 10 МИНУТ – ПОТОРОПИСЬ!</div>
        <button class="btn" onclick="window.location.href='robuxstage2.html'">Получить Robux</button>
        <div class="footnote">*Предложение действительно для новых пользователей</div>
    </div>
</body>
</html>
